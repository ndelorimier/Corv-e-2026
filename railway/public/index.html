<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvee Camp Bruchesi 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#1C2833;color:#fff;min-height:100vh;}
.hdr{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.1);}
.hdr img{height:48px;width:auto;}
.hdr-title{font-size:16px;font-weight:700;color:#EB7F3D;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.hdr-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block;margin-right:4px;}
.sync-dot.live{background:#C0DD97;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.sync-txt{font-size:10px;color:rgba(255,255,255,0.4);}
.coord-toggle{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.4);cursor:pointer;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.05);}
.stat{padding:12px;text-align:center;background:#1C2833;}
.stat-n{font-size:26px;font-weight:700;}
.stat-l{font-size:10px;opacity:0.4;margin-top:2px;text-transform:uppercase;letter-spacing:1px;}
.g{color:#C0DD97;}.o{color:#EB7F3D;}.gr{color:rgba(255,255,255,0.35);}
.progress-wrap{padding:10px 18px;background:rgba(0,0,0,0.2);}
.progress-label{font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:5px;display:flex;justify-content:space-between;}
.progress-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:#C0DD97;border-radius:3px;transition:width 0.5s;}
.content{padding:14px 18px;}
.find-wrap{margin-bottom:12px;}
.find-wrap input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:13px;}
.find-wrap input::placeholder{color:rgba(255,255,255,0.25);}
.find-wrap input:focus{outline:none;border-color:#EB7F3D;}
.filters{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.filter-btn{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;white-space:nowrap;font-weight:600;}
.filter-btn.active{background:#EB7F3D;border-color:#EB7F3D;color:#fff;}
.section-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:5px 0;margin:18px 0 8px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.4);}
.section-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.d-a1{background:#EB7F3D;}.d-a2{background:#4A8DB5;}.d-b{background:#5B7A8A;}
.card{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px 14px;margin-bottom:7px;border-left:4px solid rgba(255,255,255,0.08);transition:all 0.2s;}
.card.en-cours{border-left-color:#EB7F3D;background:rgba(235,127,61,0.08);}
.card.termine{border-left-color:#C0DD97;background:rgba(192,221,151,0.06);opacity:0.65;}
.card.hl{background:rgba(235,127,61,0.12);}
.card.hide{display:none;}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-nom{font-size:13px;font-weight:600;flex:1;line-height:1.4;}
.card-team{font-size:10px;color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.06);padding:2px 7px;border-radius:7px;white-space:nowrap;}
.card-bottom{display:flex;gap:8px;align-items:center;}
.card-status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;flex-shrink:0;}
.st-af{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);}
.st-ec{background:rgba(235,127,61,0.25);color:#EB7F3D;}
.st-tm{background:rgba(192,221,151,0.2);color:#C0DD97;}
.card-name{flex:1;font-size:12px;color:rgba(255,255,255,0.55);}
.card-name.empty{color:rgba(255,255,255,0.2);font-style:italic;}
.coord-input{flex:1;padding:5px 9px;border-radius:7px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:12px;display:none;}
.coord-input:focus{outline:none;border-color:#EB7F3D;}
.coord-btn{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.4);cursor:pointer;display:none;white-space:nowrap;}
.coord-btn:hover{border-color:#EB7F3D;color:#EB7F3D;}
body.coord-mode .coord-input{display:block;}
body.coord-mode .coord-btn{display:block;}
body.coord-mode .card-name{display:none;}
.empty-msg{text-align:center;padding:40px;color:rgba(255,255,255,0.2);font-size:14px;}
</style>
</head>

    {id:'c3',nom:'Terrain entree - Ratelage et plates-bandes',team:'4-6 personnes'},
    {id:'c4',nom:"Balayage des cotes - Abrasifs d'hiver",team:'2-4 personnes'}
  ]},
  {p:'a2',s:'Priorite A2 - Visible par les clients',tasks:[
    {id:'c5',nom:'Amiraute - Murs blancs ext. (GRAND chantier)',team:'5-6 adultes'},
    {id:'c6',nom:'Ptit Bob - Toiture de tole rouge',team:'2-3 adultes'},
    {id:'c7',nom:'Balcons Wigwam et Kibbutz - Peinture grise',team:'3-4 adultes'},
    {id:'c8',nom:'Fourmilliere - Portes rouge ext. + blanc int.',team:'2-3 adultes'},
    {id:'c9',nom:'Cafeteria - Portes ext. et int.',team:'1-2 adultes'}
  ]},
  {p:'b',s:'Priorite B - Operationnel',tasks:[
    {id:'c10',nom:"Mise a l'eau des quais",team:'4-6 adultes'},
    {id:'c11',nom:'Cafeteria - Recurage du plancher',team:'1-2 adultes'},
    {id:'c12',nom:'Dortoirs - Montage des nouveaux lits',team:'2-4 personnes'},
    {id:'c13',nom:'Jardins - Ouverture de saison',team:'2-3 personnes'},
    {id:'c14',nom:'Tentes prospecteurs - Montage structures',team:'2-4 adultes'},
    {id:'c15',nom:'Conteneur 40 verges - Remplissage',team:'3-4 adultes'},
    {id:'c16',nom:'Erabliere - Fin du desentillage',team:'2 personnes'},
    {id:'c17',nom:'Sentiers - Paillis au Kubota',team:'1-2 personnes'},
    {id:'c18',nom:'Cabane a sucre - Trim fenetres rouge',team:'1-2 adultes'},
    {id:'c19',nom:"Filet de tir a l'arc - Reparation",team:'1-2 adultes'}
  ]}
];
var state={},f='tous',q='',coordMode=false,pin='';
function gS(id){return(state[id]||{}).s||'a-faire';}
function gN(id){return(state[id]||{}).n||'';}
function lbl(s){return s=='a-faire'?'Disponible':(s=='en-cours'?'En cours':'Termine');}
function cls(s){return s=='a-faire'?'st-af':(s=='en-cours'?'st-ec':'st-tm');}
function nxt(s){return s=='a-faire'?'en-cours':(s=='en-cours'?'termine':'a-faire');}
function setFilter(v,btn){f=v;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function doSearch(v){q=v.toLowerCase().trim();render();}
function setSt(id,v){
  fetch(API+'/state',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:pin,id:id,field:'s',value:v})})
  .then(r=>r.json()).then(d=>{if(d.state){state=d.state;render();}});
}
function setNm(id,v){
  fetch(API+'/state',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:pin,id:id,field:'n',value:v})});
}
function toggleCoord(){
  if(!coordMode){
    var p=prompt('Code coordinateur:');
    if(!p)return;
    fetch(API+'/state',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:p,id:'_test',field:'_x',value:''})})
    .then(r=>{
      if(r.status===403){alert('Code incorrect');return r.json();}
      return r.json();
    }).then(d=>{
      if(d&&!d.error){
        pin=p;coordMode=true;
        document.body.classList.add('coord-mode');
        document.getElementById('coord-btn').textContent='Mode benevole';
        document.getElementById('coord-btn').style.color='#EB7F3D';
      }
    });
  } else {
    coordMode=false;pin='';
    document.body.classList.remove('coord-mode');
    document.getElementById('coord-btn').textContent='Mode coordinateur';
    document.getElementById('coord-btn').style.color='';
  }
}
function fetchState(){
  fetch(API+'/state?t='+Date.now())
  .then(r=>r.json())
  .then(d=>{
    state=d.state;render();
    document.getElementById('dot').className='sync-dot live';
    document.getElementById('sync-txt').textContent='En direct';
  })
  .catch(()=>{
    document.getElementById('dot').className='sync-dot';
    document.getElementById('sync-txt').textContent='Hors ligne';
  });
}
function render(){
  var total=0,done=0,prog=0,todo=0;
  DATA.forEach(s=>s.tasks.forEach(t=>{total++;var v=gS(t.id);if(v=='termine')done++;else if(v=='en-cours')prog++;else todo++;}));
  document.getElementById('nd').textContent=done;
  document.getElementById('np').textContent=prog;
  document.getElementById('nt').textContent=todo;
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pbar').style.width=pct+'%';
  var html='';
  DATA.forEach(function(section){
    var vis=section.tasks.filter(function(t){
      var nm=gN(t.id).toLowerCase();
      var mq=!q||(t.nom.toLowerCase().includes(q)||nm.includes(q));
      return mq&&(f=='tous'||gS(t.id)===f);
    });
    if(!vis.length)return;
    html+='<div class="section-hdr"><div class="s-dot d-'+section.p+'"></div>'+section.s+'</div>';
    section.tasks.forEach(function(t){
      var v=gS(t.id),nm=gN(t.id);
      var mq=!q||(t.nom.toLowerCase().includes(q)||nm.toLowerCase().includes(q));
      var mf=f=='tous'||v===f;
      if(!mq||!mf){return;}
      var hl=(q&&mq)?'hl':'';
      var nameHtml=nm?('<span class="card-name">'+nm+'</span>'):('<span class="card-name empty">Non assigne</span>');
      html+='<div class="card '+v+' '+hl+'">'
        +'<div class="card-top"><div class="card-nom">'+t.nom+'</div><div class="card-team">'+t.team+'</div></div>'
        +'<div class="card-bottom">'
        +'<div class="card-status '+cls(v)+'">'+lbl(v)+'</div>'
        +nameHtml
        +'<input class="coord-input" placeholder="Noms benevoles" value="'+nm+'" oninput="setNm(''+t.id+'',this.value)">'
        +'<button class="coord-btn" onclick="setSt(''+t.id+'',''+nxt(v)+'')">'+lbl(nxt(v))+'</button>'
        +'</div></div>';
    });
  });
  document.getElementById('board').innerHTML=html||'<div class="empty-msg">Aucun chantier trouve</div>';
}
fetchState();
setInterval(fetchState,10000);
</script>
</body>
</html>
