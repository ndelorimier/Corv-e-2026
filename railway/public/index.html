<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvee Camp Bruchesi 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#1C2833;color:#fff;min-height:100vh;}
.hdr{padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.1);}
.hdr img{height:52px;width:auto;}
.hdr-title{font-size:17px;font-weight:700;color:#EB7F3D;}
.hdr-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;}
.hdr-right{margin-left:auto;text-align:right;}
.sync-badge{font-size:10px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}
.sync-badge.live{background:rgba(39,80,10,0.4);color:#C0DD97;}
.sync-badge.err{background:rgba(180,40,40,0.3);color:#FF9999;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,0.05);}
.stat{padding:14px;text-align:center;background:#1C2833;}
.stat-n{font-size:28px;font-weight:700;}
.stat-l{font-size:11px;opacity:0.5;margin-top:2px;text-transform:uppercase;letter-spacing:1px;}
.g{color:#C0DD97;}
.o{color:#EB7F3D;}
.gr{color:rgba(255,255,255,0.4);}
.progress-wrap{padding:12px 20px;background:rgba(0,0,0,0.2);}
.progress-label{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:6px;display:flex;justify-content:space-between;}
.progress-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:#C0DD97;border-radius:3px;transition:width 0.5s;}
.content{padding:16px 20px;}
.filters{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.filter-btn{font-size:12px;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;white-space:nowrap;font-weight:600;}
.filter-btn.active{background:#EB7F3D;border-color:#EB7F3D;color:#fff;}
.find-wrap{margin-bottom:16px;}
.find-wrap input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:#fff;font-size:14px;}
.find-wrap input::placeholder{color:rgba(255,255,255,0.3);}
.find-wrap input:focus{outline:none;border-color:#EB7F3D;}
.section-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:6px 0;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
.section-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}
.s-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.d-a1{background:#EB7F3D;}
.d-a2{background:#4A8DB5;}
.d-b{background:#5B7A8A;}
.card{background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:8px;border-left:4px solid rgba(255,255,255,0.1);transition:all 0.2s;}
.card.en-cours{border-left-color:#EB7F3D;background:rgba(235,127,61,0.1);}
.card.termine{border-left-color:#C0DD97;background:rgba(192,221,151,0.08);opacity:0.7;}
.card.hl{background:rgba(235,127,61,0.15);}
.card.hide{display:none;}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
.card-nom{font-size:14px;font-weight:600;flex:1;line-height:1.4;}
.card-team{font-size:11px;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.07);padding:3px 8px;border-radius:8px;white-space:nowrap;}
.card-bottom{display:flex;gap:8px;align-items:center;}
.card-status{font-size:12px;padding:5px 12px;border-radius:20px;font-weight:700;flex-shrink:0;}
.st-af{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}
.st-ec{background:rgba(235,127,61,0.3);color:#EB7F3D;}
.st-tm{background:rgba(192,221,151,0.3);color:#C0DD97;}
.card-name{flex:1;font-size:13px;color:rgba(255,255,255,0.7);}
.card-name.empty{color:rgba(255,255,255,0.25);font-style:italic;}
.coord-input{flex:1;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#fff;font-size:13px;display:none;}
.coord-input:focus{outline:none;border-color:#EB7F3D;}
.coord-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;display:none;}
body.coord-mode .coord-input{display:block;}
body.coord-mode .coord-btn{display:block;}
body.coord-mode .card-name{display:none;}
.coord-toggle{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.4);cursor:pointer;}
.claim-btn{font-size:12px;padding:6px 14px;border-radius:20px;border:none;background:#EB7F3D;color:#fff;cursor:pointer;font-weight:700;white-space:nowrap;flex-shrink:0;}
.claim-btn:active{opacity:0.8;}
body.coord-mode .claim-btn{display:none;}
.claim-form{display:none;margin-top:10px;gap:8px;align-items:center;}
.claim-form.open{display:flex;}
.claim-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(235,127,61,0.5);background:rgba(255,255,255,0.07);color:#fff;font-size:14px;}
.claim-input:focus{outline:none;border-color:#EB7F3D;}
.claim-submit{padding:8px 16px;border-radius:8px;border:none;background:#EB7F3D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.claim-submit:disabled{opacity:0.4;cursor:default;}
.claim-cancel{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;}
.release-btn{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid rgba(235,127,61,0.4);background:transparent;color:rgba(235,127,61,0.7);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.release-btn:active{opacity:0.7;}
body.coord-mode .release-btn{display:none;}
.card.mine{border-left-color:#8BC6F1 !important;box-shadow:0 0 0 1px rgba(139,198,241,0.2);}
.myname-wrap{margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.myname-wrap label{font-size:12px;color:rgba(255,255,255,0.4);white-space:nowrap;}
.myname-input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:#fff;font-size:14px;}
.myname-input:focus{outline:none;border-color:#8BC6F1;}
.celebrate{display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#EB7F3D,#C0DD97);padding:16px 20px;text-align:center;font-size:16px;font-weight:700;color:#1C2833;z-index:100;gap:12px;align-items:center;justify-content:center;}
.note-btn{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.35);cursor:pointer;margin-top:8px;display:block;}
.note-btn:hover{color:rgba(255,255,255,0.6);}
.note-area{width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#fff;font-size:13px;resize:none;font-family:inherit;display:none;}
.note-area.open{display:block;}
.note-area:focus{outline:none;border-color:#8BC6F1;}
.note-text{font-size:12px;color:rgba(255,255,255,0.45);font-style:italic;margin-top:6px;padding:0 2px;line-height:1.4;}
.theme-btn,.proj-btn,.sound-btn,.qr-btn{font-size:15px;background:transparent;border:none;cursor:pointer;padding:2px 6px;opacity:0.6;}
.theme-btn:hover,.proj-btn:hover,.sound-btn:hover,.qr-btn:hover{opacity:1;}
.qr-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;}
.qr-overlay.open{display:flex;}
.qr-box{background:#1C2833;border-radius:16px;padding:24px;text-align:center;max-width:280px;width:90%;}
.qr-box img{width:200px;height:200px;border-radius:8px;background:#fff;padding:6px;}
.qr-url{font-size:11px;color:rgba(255,255,255,0.4);margin-top:10px;word-break:break-all;}
.qr-close{margin-top:16px;padding:8px 24px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;font-size:13px;}
body.light .qr-box{background:#F0EFE8;color:#1C2833;}
body.light .qr-url{color:rgba(0,0,0,0.4);}
body.light .qr-close{color:rgba(0,0,0,0.5);}
@keyframes card-flash{0%{box-shadow:0 0 0 0 rgba(235,127,61,0.9);}40%{box-shadow:0 0 0 8px rgba(235,127,61,0.3);}100%{box-shadow:0 0 0 0 rgba(235,127,61,0);}}
.card.flash{animation:card-flash 1.8s ease-out;}
.new-badge{display:inline-block;font-size:10px;font-weight:700;background:#EB7F3D;color:#fff;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;animation:fade-badge 4s ease-out forwards;}
@keyframes fade-badge{0%,60%{opacity:1;}100%{opacity:0;}}
body.projection .hdr-title{font-size:26px;}
body.projection .hdr-sub{font-size:16px;}
body.projection .stat{padding:22px;}
body.projection .stat-n{font-size:52px;}
body.projection .stat-l{font-size:14px;}
body.projection .progress-bar{height:10px;}
body.projection .content{padding:20px 30px;}
body.projection .card{padding:18px 20px;margin-bottom:12px;border-left-width:6px;}
body.projection .card-nom{font-size:20px;}
body.projection .card-team{font-size:14px;padding:5px 12px;}
body.projection .card-status{font-size:15px;padding:7px 16px;}
body.projection .card-name{font-size:18px;}
body.projection .section-hdr{font-size:13px;margin:28px 0 12px;}
body.projection .myname-wrap,body.projection .find-wrap,body.projection .filters,
body.projection .claim-btn,body.projection .claim-form,body.projection .release-btn,
body.projection .note-btn,body.projection .note-area,body.projection .note-text,
body.projection .coord-toggle,body.projection .coord-btn,body.projection .coord-input{display:none!important;}
body.light{background:#EDECEA;color:#1C2833;}
body.light .hdr{border-bottom-color:rgba(0,0,0,0.1);}
body.light .hdr-sub{color:rgba(0,0,0,0.4);}
body.light .hdr-title{color:#C0621A;}
body.light .stat{background:#EDECEA;}
body.light .stats{background:rgba(0,0,0,0.06);}
body.light .progress-wrap{background:rgba(0,0,0,0.05);}
body.light .progress-bar{background:rgba(0,0,0,0.1);}
body.light .card{background:rgba(0,0,0,0.04);}
body.light .card.en-cours{background:rgba(235,127,61,0.1);}
body.light .card.termine{background:rgba(100,160,80,0.06);}
body.light .card.mine{box-shadow:0 0 0 1px rgba(60,120,180,0.3);}
body.light .card-team{color:rgba(0,0,0,0.4);background:rgba(0,0,0,0.06);}
body.light .card-name{color:rgba(0,0,0,0.6);}
body.light .card-name.empty{color:rgba(0,0,0,0.25);}
body.light .st-af{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.4);}
body.light .st-ec{background:rgba(235,127,61,0.2);color:#C0621A;}
body.light .st-tm{background:rgba(80,140,60,0.2);color:#3D7A30;}
body.light .g{color:#3D7A30;}
body.light .gr{color:rgba(0,0,0,0.35);}
body.light .sync-badge{background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.4);}
body.light .sync-badge.live{background:rgba(60,130,40,0.15);color:#3D7A30;}
body.light .sync-badge.err{background:rgba(180,40,40,0.1);color:#AA2020;}
body.light .filter-btn{color:rgba(0,0,0,0.5);border-color:rgba(0,0,0,0.2);}
body.light .find-wrap input,body.light .myname-input,body.light .coord-input,body.light .claim-input,body.light .note-area{background:rgba(0,0,0,0.05);color:#1C2833;border-color:rgba(0,0,0,0.15);}
body.light .section-hdr::after{background:rgba(0,0,0,0.1);}
body.light .myname-wrap label{color:rgba(0,0,0,0.4);}
body.light .note-text{color:rgba(0,0,0,0.45);}
body.light .note-btn{border-color:rgba(0,0,0,0.12);color:rgba(0,0,0,0.4);}
body.light .coord-toggle,body.light .claim-cancel,body.light .release-btn{color:rgba(0,0,0,0.4);border-color:rgba(0,0,0,0.15);}
body.light .progress-label{color:rgba(0,0,0,0.4);}
body.light .empty-state{color:rgba(0,0,0,0.3);}
body.light .celebrate{color:#1C2833;}
.edit-icon-btn{background:transparent;border:none;cursor:pointer;font-size:13px;padding:2px 6px;display:none;opacity:0.5;flex-shrink:0;}
.edit-icon-btn:hover{opacity:1;}
body.coord-mode .edit-icon-btn{display:inline-block;}
.edit-panel{display:none;flex-direction:column;gap:8px;margin-top:10px;padding:12px;background:rgba(0,0,0,0.25);border-radius:10px;}
.edit-panel.open{display:flex;}
.edit-row{display:flex;align-items:center;gap:8px;}
.edit-lbl{font-size:11px;color:rgba(255,255,255,0.4);width:56px;flex-shrink:0;}
.edit-inp{flex:1;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#fff;font-size:13px;}
.edit-inp:focus{outline:none;border-color:#EB7F3D;}
.edit-sel{flex:1;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#2A3542;color:#fff;font-size:13px;}
.edit-actions{display:flex;gap:8px;margin-top:4px;}
.edit-save{padding:7px 16px;border-radius:8px;border:none;background:#EB7F3D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.edit-cancel-btn{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;}
.edit-delete{margin-left:auto;padding:7px 12px;border-radius:8px;border:1px solid rgba(220,80,80,0.4);background:transparent;color:rgba(220,80,80,0.7);font-size:13px;cursor:pointer;}
.add-task-btn{width:100%;padding:10px;border-radius:10px;border:2px dashed rgba(255,255,255,0.12);background:transparent;color:rgba(255,255,255,0.3);font-size:13px;cursor:pointer;margin-top:6px;display:none;}
.add-task-btn:hover{border-color:rgba(235,127,61,0.4);color:rgba(235,127,61,0.6);}
body.coord-mode .add-task-btn{display:block;}
body.light .edit-panel{background:rgba(0,0,0,0.06);}
body.light .edit-inp,body.light .edit-sel{background:rgba(0,0,0,0.05);color:#1C2833;border-color:rgba(0,0,0,0.15);}
body.light .edit-lbl{color:rgba(0,0,0,0.4);}
body.light .add-task-btn{border-color:rgba(0,0,0,0.15);color:rgba(0,0,0,0.3);}
.empty-state{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.3);}
.empty-state div{font-size:32px;margin-bottom:8px;}
</style>
</head>

<div class="celebrate" id="celebrate">
  <span>&#127881;</span>
  <span>Toutes les priorites A sont terminees &mdash; Bravo l&rsquo;equipe !</span>
  <span>&#127881;</span>
</div>

<script>
// ─── CONFIGURATION ────────────────────────────────────────────────────────────
// Si servi directement par Railway : laisser vide (utilise URLs relatives)
// Si utilise en fichier standalone : mettre l'URL Railway ici
// Ex: var API_URL = 'https://corvee-bruchesi.up.railway.app';
var API_URL = '';
var POLL_MS = 10000; // refresh toutes les 10 secondes
// ──────────────────────────────────────────────────────────────────────────────

var DATA=[];
var SECTION_LABELS={a1:'Priorite A1 — Entree du site',a2:'Priorite A2 — Visible par les clients',b:'Priorite B — Operationnel'};

var state={}, f='tous', q='', coordMode=false, coordPin='', pollTimer=null;
var nameDebounce={}, noteDebounce={};
var myName='', lightMode=false, projMode=false, soundEnabled=false;
var prevState=null, recentChanges={};

function load(){
  try{state=JSON.parse(localStorage.getItem('cv26b')||'{}')}catch(e){state={}}
  myName=localStorage.getItem('cv26_myname')||'';
  if(myName){
    var inp=document.getElementById('myname-input');
    if(inp)inp.value=myName;
    var btn=document.getElementById('filter-mine');
    if(btn)btn.style.display='block';
  }
  lightMode=localStorage.getItem('cv26_theme')==='light';
  if(lightMode){document.body.classList.add('light');var tb=document.getElementById('theme-btn');if(tb)tb.textContent='☀️';}
  soundEnabled=localStorage.getItem('cv26_sound')==='1';
  if(soundEnabled){var sb=document.getElementById('sound-btn');if(sb){sb.textContent='🔔';sb.style.opacity='1';}}
  else{var sb2=document.getElementById('sound-btn');if(sb2)sb2.textContent='🔕';}
}
function save(){try{localStorage.setItem('cv26b',JSON.stringify(state))}catch(e){}}

function loadData(cb){
  fetch(apiBase()+'/api/tasks?t='+Date.now())
    .then(r=>r.json())
    .then(function(d){if(d.tasks){DATA=d.tasks;}if(cb)cb();})
    .catch(function(){if(!DATA.length){DATA=[
      {p:'a1',s:SECTION_LABELS.a1,tasks:[
        {id:'c1',nom:"Cabane d'accueil — Appret + blanc + toiture rouge",team:'3-4 adultes'},
        {id:'c2',nom:'Toilettes Bayou — Grattage + peinture blanche',team:'2-3 adultes'},
        {id:'c3',nom:'Terrain entree — Ratelage et plates-bandes',team:'4-6 personnes'},
        {id:'c4',nom:"Balayage des cotes — Abrasifs d'hiver",team:'2-4 personnes'},
      ]},
      {p:'a2',s:SECTION_LABELS.a2,tasks:[
        {id:'c5',nom:'Amiraute — Murs blancs ext. (GRAND chantier)',team:'5-6 adultes'},
        {id:'c6',nom:'Ptit Bob — Toiture de tole rouge',team:'2-3 adultes'},
        {id:'c7',nom:'Balcons Wigwam et Kibbutz — Peinture grise',team:'3-4 adultes'},
        {id:'c8',nom:'Fourmilliere — Portes rouge ext. + blanc int.',team:'2-3 adultes'},
        {id:'c9',nom:'Cafeteria — Portes ext. et int.',team:'1-2 adultes'},
      ]},
      {p:'b',s:SECTION_LABELS.b,tasks:[
        {id:'c10',nom:"Mise a l'eau des quais",team:'4-6 adultes'},
        {id:'c11',nom:'Cafeteria — Recurage du plancher',team:'1-2 adultes'},
        {id:'c12',nom:'Dortoirs — Montage des nouveaux lits',team:'2-4 personnes'},
        {id:'c13',nom:'Jardins — Ouverture de saison',team:'2-3 personnes'},
        {id:'c14',nom:'Tentes prospecteurs — Montage structures',team:'2-4 adultes'},
        {id:'c15',nom:'Conteneur 40 verges — Remplissage',team:'3-4 adultes'},
        {id:'c16',nom:'Erabliere — Fin du desentillage',team:'2 personnes'},
        {id:'c17',nom:'Sentiers — Paillis au Kubota',team:'1-2 personnes'},
        {id:'c18',nom:'Cabane a sucre — Trim fenetres rouge',team:'1-2 adultes'},
        {id:'c19',nom:"Filet de tir a l'arc — Reparation",team:'1-2 adultes'},
      ]}
    ];}if(cb)cb();});
}

function pushTasks(){
  fetch(apiBase()+'/api/tasks',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:coordPin,tasks:DATA})
  }).catch(()=>{});
}

function openEditPanel(id){
  document.querySelectorAll('.edit-panel.open').forEach(function(el){
    if(el.id!=='ep-'+id)el.classList.remove('open');
  });
  var ep=document.getElementById('ep-'+id);
  if(ep)ep.classList.toggle('open');
}

function saveTaskEdit(id){
  var nomEl=document.getElementById('ei-nom-'+id);
  var teamEl=document.getElementById('ei-team-'+id);
  var secEl=document.getElementById('ei-sec-'+id);
  if(!nomEl||!nomEl.value.trim())return;
  var newNom=nomEl.value.trim();
  var newTeam=teamEl?teamEl.value.trim():'';
  var newSec=secEl?secEl.value:'';
  var moved=false;
  DATA.forEach(function(sec){
    sec.tasks.forEach(function(t){
      if(t.id===id){t.nom=newNom;if(newTeam)t.team=newTeam;}
    });
    if(newSec&&sec.p===newSec){
      var oldSec=DATA.find(function(s){return s.tasks.some(function(t){return t.id===id;});});
      if(oldSec&&oldSec.p!==newSec){
        var task=oldSec.tasks.find(function(t){return t.id===id;});
        oldSec.tasks=oldSec.tasks.filter(function(t){return t.id!==id;});
        sec.tasks.push(task);
        moved=true;
      }
    }
  });
  pushTasks();
  render();
}

function deleteTask(id){
  if(!confirm('Supprimer ce chantier definitivement?'))return;
  DATA.forEach(function(sec){
    sec.tasks=sec.tasks.filter(function(t){return t.id!==id;});
  });
  pushTasks();
  render();
}

function addTask(sectionP){
  var newId='t'+Date.now().toString(36);
  DATA.forEach(function(sec){
    if(sec.p===sectionP)sec.tasks.push({id:newId,nom:'',team:''});
  });
  render();
  setTimeout(function(){
    var el=document.getElementById('ei-nom-'+newId);
    if(el){el.focus();var ep=document.getElementById('ep-'+newId);if(ep)ep.classList.add('open');}
  },50);
}

function setMyName(v){
  myName=v.trim();
  localStorage.setItem('cv26_myname',myName);
  var btn=document.getElementById('filter-mine');
  if(btn)btn.style.display=myName?'block':'none';
  if(!myName&&f==='mine')setFilter('tous',document.querySelector('.filter-btn'));
  render();
}

function releaseTask(id){
  if(!confirm('Liberer ce chantier et le remettre disponible?'))return;
  fetch(apiBase()+'/api/release',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id})
  }).then(r=>r.json()).then(data=>{
    if(data.state){state=data.state;save();render();}
    else if(data.error){alert(data.error);}
  }).catch(function(){
    if(!state[id])state[id]={};
    state[id].s='a-faire';
    state[id].n='';
    save();render();
  });
}

function showQR(){
  var url=window.location.href.split('?')[0];
  var img=document.getElementById('qr-img');
  var lbl=document.getElementById('qr-url');
  if(img)img.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url);
  if(lbl)lbl.textContent=url;
  var ov=document.getElementById('qr-overlay');
  if(ov)ov.classList.add('open');
}
function closeQR(){
  var ov=document.getElementById('qr-overlay');
  if(ov)ov.classList.remove('open');
}

function toggleProjection(){
  projMode=!projMode;
  document.body.classList.toggle('projection',projMode);
  var b=document.getElementById('proj-btn');
  if(b){b.style.opacity=projMode?'1':'0.6';}
  if(projMode&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  else if(!projMode&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
}

function toggleSound(){
  soundEnabled=!soundEnabled;
  localStorage.setItem('cv26_sound',soundEnabled?'1':'0');
  var b=document.getElementById('sound-btn');
  if(b){b.textContent=soundEnabled?'🔔':'🔕';b.style.opacity=soundEnabled?'1':'0.6';}
  if(soundEnabled){
    // debloquer AudioContext sur interaction utilisateur
    try{var ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.close();}catch(e){}
  }
}

function playSound(type){
  if(!soundEnabled)return;
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var g=ctx.createGain();
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);
    var o=ctx.createOscillator();
    o.connect(g);
    if(type==='claim'){
      o.type='sine';
      o.frequency.setValueAtTime(660,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.15);
    } else {
      o.type='triangle';
      o.frequency.setValueAtTime(523,ctx.currentTime);
      o.frequency.setValueAtTime(784,ctx.currentTime+0.15);
      o.frequency.setValueAtTime(1047,ctx.currentTime+0.3);
    }
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime+0.6);
  }catch(e){}
}

function detectChanges(newState){
  if(!prevState){prevState=JSON.parse(JSON.stringify(newState));return;}
  var TASK_IDS=['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11','c12','c13','c14','c15','c16','c17','c18','c19'];
  TASK_IDS.forEach(function(id){
    var prev=(prevState[id]||{}).s||'a-faire';
    var curr=(newState[id]||{}).s||'a-faire';
    if(prev!==curr){
      recentChanges[id]=Date.now()+4000;
      if(curr==='en-cours')playSound('claim');
      if(curr==='termine')playSound('complete');
      render();
      setTimeout(function(){
        var card=document.getElementById('card-'+id);
        if(card){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');}
      },30);
      setTimeout(function(){delete recentChanges[id];render();},4500);
    }
  });
  prevState=JSON.parse(JSON.stringify(newState));
}

function toggleTheme(){
  lightMode=!lightMode;
  document.body.classList.toggle('light',lightMode);
  localStorage.setItem('cv26_theme',lightMode?'light':'dark');
  var tb=document.getElementById('theme-btn');
  if(tb)tb.textContent=lightMode?'☀️':'🌙';
}

function gNote(id){return(state[id]||{}).note||'';}

function toggleNote(id){
  var area=document.getElementById('note-area-'+id);
  var btn=document.getElementById('note-btn-'+id);
  if(!area)return;
  var open=area.classList.toggle('open');
  if(open){area.focus();}
  if(btn)btn.textContent=open?(gNote(id)?'✕ Fermer':'✕ Annuler'):(gNote(id)?'✏️ Modifier la note':'+ Ajouter une note');
}

function draftNote(id,val){
  clearTimeout(noteDebounce[id]);
  noteDebounce[id]=setTimeout(function(){saveNote(id,val);},800);
}

function saveNote(id,val){
  var area=document.getElementById('note-area-'+id);
  var value=(val!==undefined?val:(area?area.value:'')).trim();
  if(!state[id])state[id]={};
  state[id].note=value;
  save();
  var btn=document.getElementById('note-btn-'+id);
  if(btn)btn.textContent=value?'✏️ Modifier la note':'+ Ajouter une note';
  fetch(apiBase()+'/api/note',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id,note:value})
  }).catch(()=>{});
}

function checkCelebration(){
  var a1a2=['c1','c2','c3','c4','c5','c6','c7','c8','c9'];
  var allDone=a1a2.every(function(id){return gS(id)==='termine';});
  var banner=document.getElementById('celebrate');
  if(banner)banner.style.display=allDone?'flex':'none';
}
function gS(id){return(state[id]||{}).s||'a-faire'}
function gN(id){return(state[id]||{}).n||''}
function apiBase(){return API_URL||'';}

function setSt(id,v){
  if(!state[id])state[id]={};
  state[id].s=v;
  save();
  render();
  if(coordMode){
    fetch(apiBase()+'/api/state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:coordPin,id:id,field:'s',value:v})
    }).then(r=>r.json()).then(data=>{
      if(data.state){state=data.state;save();render();}
    }).catch(()=>{});
  }
}

function claimTask(id){
  var form=document.getElementById('claim-form-'+id);
  if(!form)return;
  form.classList.toggle('open');
  if(form.classList.contains('open')){
    var inp=document.getElementById('claim-input-'+id);
    if(inp)inp.focus();
  }
}

function submitClaim(id){
  var inp=document.getElementById('claim-input-'+id);
  var btn=document.getElementById('claim-submit-'+id);
  var name=(inp?inp.value:'').trim();
  if(!name)return;
  if(btn)btn.disabled=true;
  fetch(apiBase()+'/api/claim',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id,name:name})
  }).then(r=>r.json()).then(data=>{
    if(data.state){state=data.state;save();render();}
    else if(data.error){alert(data.error);if(btn)btn.disabled=false;}
  }).catch(function(){
    // fallback offline: update local state
    if(!state[id])state[id]={};
    state[id].s='en-cours';
    state[id].n=name;
    save();render();
  });
}

function setNm(id,v){
  if(!state[id])state[id]={};
  state[id].n=v;
  save();
  if(coordMode){
    clearTimeout(nameDebounce[id]);
    nameDebounce[id]=setTimeout(function(){
      fetch(apiBase()+'/api/state',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pin:coordPin,id:id,field:'n',value:v})
      }).catch(()=>{});
    },600);
  }
}

function fetchState(){
  fetch(apiBase()+'/api/state?t='+Date.now())
    .then(r=>r.json())
    .then(function(data){
      if(data.state){detectChanges(data.state);state=data.state;save();render();}
      setBadge('live');
    })
    .catch(function(){setBadge('err');});
}

function setBadge(mode){
  var b=document.getElementById('sync-badge');
  if(mode==='live'){b.textContent='Sync en direct';b.className='sync-badge live';}
  else if(mode==='err'){b.textContent='Hors-ligne';b.className='sync-badge err';}
  else{b.textContent='Statique';b.className='sync-badge';}
}

function startPolling(){
  fetchState();
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(fetchState,POLL_MS);
}

function nxt(c){return c=='a-faire'?'en-cours':(c=='en-cours'?'termine':'a-faire')}
function lbl(s){return s=='a-faire'?'Disponible':(s=='en-cours'?'En cours':'Termine')}
function cls(s){return s=='a-faire'?'st-af':(s=='en-cours'?'st-ec':'st-tm')}

function setFilter(v,btn){
  f=v;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function doSearch(v){q=v.toLowerCase().trim();render();}

function toggleCoord(){
  if(!coordMode){
    var pin=prompt('Code coordinateur (4 chiffres):');
    if(pin!=='2026')return;
    coordPin=pin;
    coordMode=true;
    document.body.classList.add('coord-mode');
    document.getElementById('coord-btn').textContent='Mode benevole';
    document.getElementById('coord-btn').style.color='#EB7F3D';
  }else{
    coordMode=false;
    coordPin='';
    document.body.classList.remove('coord-mode');
    document.getElementById('coord-btn').textContent='Mode coordinateur';
    document.getElementById('coord-btn').style.color='';
  }
}

function render(){
  var total=0,done=0,prog=0,todo=0;
  DATA.forEach(s=>s.tasks.forEach(t=>{total++;var v=gS(t.id);if(v=='termine')done++;else if(v=='en-cours')prog++;else todo++}));
  document.getElementById('nd').textContent=done;
  document.getElementById('np').textContent=prog;
  document.getElementById('nt').textContent=todo;
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pbar').style.width=pct+'%';
  var html='';
  DATA.forEach(function(section){
    var vis=section.tasks.filter(function(t){
      var v=gS(t.id),nm=gN(t.id).toLowerCase();
      var mq=!q||(t.nom.toLowerCase().includes(q)||nm.includes(q));
      return mq&&(f=='tous'||v===f);
    });
    var dotCls='d-'+section.p;
    html+='<div class="section-hdr"><div class="s-dot '+dotCls+'"></div>'+section.s+'</div>';
    if(!vis.length&&f==='tous'&&!q){}
    section.tasks.forEach(function(t){
      var v=gS(t.id),nm=gN(t.id);
      var mq=!q||(t.nom.toLowerCase().includes(q)||nm.toLowerCase().includes(q));
      var isMine=myName&&nm.toLowerCase().includes(myName.toLowerCase());
      var mf=f==='tous'||v===f||(f==='mine'&&isMine);
      var hid=(!mq||!mf)?'hide':'';
      var hl=(q&&mq&&mf)?'hl':'';
      var mineClass=isMine?'mine':'';
      var nameHtml=nm?('<span class="card-name">'+nm+'</span>'):('<span class="card-name empty">Non assigne</span>');
      var btnHtml='<button class="coord-btn" onclick="setSt(\''+t.id+'\',\''+nxt(v)+'\')">'+lbl(v)+'</button>';
      var claimHtml='';
      if(v==='a-faire'){
        var prefill=myName?(' value="'+myName.replace(/"/g,'&quot;')+'"'):'';
        claimHtml='<button class="claim-btn" onclick="claimTask(\''+t.id+'\')">Je prends ce chantier</button>'+
          '<div class="claim-form" id="claim-form-'+t.id+'">'+
          '<input class="claim-input" id="claim-input-'+t.id+'" placeholder="Ton prenom..." maxlength="40"'+prefill+' '+
            'onkeydown="if(event.key===\'Enter\')submitClaim(\''+t.id+'\')">'+
          '<button class="claim-submit" id="claim-submit-'+t.id+'" onclick="submitClaim(\''+t.id+'\')">Confirmer</button>'+
          '<button class="claim-cancel" onclick="claimTask(\''+t.id+'\')">&#x2715;</button>'+
          '</div>';
      }
      var releaseHtml='';
      if(v==='en-cours'){
        releaseHtml='<button class="release-btn" onclick="releaseTask(\''+t.id+'\')">Liberer</button>';
      }
      var isNew=recentChanges[t.id]&&recentChanges[t.id]>Date.now();
      var newBadge=isNew?'<span class="new-badge">Nouveau</span>':'';
      var note=gNote(t.id);
      var noteHtml='<div>'+
        (note?'<div class="note-text">'+note.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>':'')+
        '<textarea class="note-area" id="note-area-'+t.id+'" rows="2" maxlength="200" placeholder="Ajouter une note visible par tous..." '+
          'oninput="draftNote(\''+t.id+'\',this.value)" onblur="saveNote(\''+t.id+'\')">'+
          note.replace(/&/g,'&amp;').replace(/</g,'&lt;')+
        '</textarea>'+
        '<button class="note-btn" id="note-btn-'+t.id+'" onclick="toggleNote(\''+t.id+'\')">'+
          (note?'✏️ Modifier la note':'+ Ajouter une note')+
        '</button>'+
        '</div>';
      var esc=function(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');};
      var editPanel='<div class="edit-panel" id="ep-'+t.id+'">'+
        '<div class="edit-row"><span class="edit-lbl">Nom</span>'+
        '<input class="edit-inp" id="ei-nom-'+t.id+'" value="'+esc(t.nom)+'" placeholder="Nom du chantier..." '+
          'onkeydown="if(event.key===\'Enter\')saveTaskEdit(\''+t.id+'\')"></div>'+
        '<div class="edit-row"><span class="edit-lbl">Equipe</span>'+
        '<input class="edit-inp" id="ei-team-'+t.id+'" value="'+esc(t.team)+'" placeholder="ex: 2-3 adultes">'+
        '<span class="edit-lbl" style="width:auto;margin-left:8px;">Section</span>'+
        '<select class="edit-sel" id="ei-sec-'+t.id+'">'+
        DATA.map(function(sec){return'<option value="'+sec.p+'"'+(sec.tasks.some(function(x){return x.id===t.id;})?'selected':'')+'>'+sec.s+'</option>';}).join('')+
        '</select></div>'+
        '<div class="edit-actions">'+
        '<button class="edit-save" onclick="saveTaskEdit(\''+t.id+'\')">Enregistrer</button>'+
        '<button class="edit-cancel-btn" onclick="openEditPanel(\''+t.id+'\')">Annuler</button>'+
        '<button class="edit-delete" onclick="deleteTask(\''+t.id+'\')">&#128465; Supprimer</button>'+
        '</div></div>';
      html+='<div id="card-'+t.id+'" class="card '+v+' '+hid+' '+hl+' '+mineClass+'">'+
        '<div class="card-top">'+
        '<div class="card-nom">'+t.nom+newBadge+'</div>'+
        '<button class="edit-icon-btn" onclick="openEditPanel(\''+t.id+'\')" title="Modifier">✏️</button>'+
        '<div class="card-team">'+t.team+'</div>'+
        '</div>'+
        '<div class="card-bottom">'+
        '<div class="'+cls(v)+' card-status">'+lbl(v)+'</div>'+
        nameHtml+
        '<input class="coord-input" placeholder="Nom(s) benevoles" value="'+nm+'" oninput="setNm(\''+t.id+'\',this.value)">'+
        btnHtml+
        releaseHtml+
        '</div>'+
        claimHtml+
        noteHtml+
        editPanel+
        '</div>';
    });
    html+='<button class="add-task-btn" onclick="addTask(\''+section.p+'\')">+ Ajouter une tache a cette section</button>';
  });
  document.getElementById('board').innerHTML=html||'<div class="empty-state"><div>&#128269;</div>Aucun chantier trouve</div>';
  checkCelebration();
}

load();
render();
loadData(function(){render();startPolling();});
</script>
</body>
</html>
