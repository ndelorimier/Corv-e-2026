<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corvée — Camp Bruchési</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;800;900&display=swap">
<style>
:root{--bg:#FDEFE3;--surface:#FFFFFF;--ink:#1C2833;--muted:#4A5560;--line:#E8D5C2;--track:#F1E4D6;--warm:#FFF6EE;--accentText:#9C4610;--lakeText:#1F5F8B;--lakeBg:#E1F0FB;--doneText:#2F6B26;--doneBg:#F3F8EF;--doneBtn:#2F6B26;--doneBtnInk:#FFFFFF;--tagIdle:#F1E4D6;--maxw:760px}
html.soir,html.proj{--bg:#1C2833;--surface:#243443;--ink:#FFFFFF;--muted:#C3CDD6;--line:#3A4B5C;--track:#2E3F50;--warm:#2C3D4E;--accentText:#F5A46E;--lakeText:#8BC6F1;--lakeBg:#22405A;--doneText:#A9D98C;--doneBg:#22352A;--doneBtn:#A9D98C;--doneBtnInk:#1C2833;--tagIdle:#33475A}
html.proj{--maxw:1680px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Red Hat Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--lakeText);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{min-height:100vh;padding-bottom:96px}
.wrap{max-width:var(--maxw);margin:0 auto}

/* boutons et champs */
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;color:var(--ink);background:transparent}
.btn-orange{background:#EB7F3D;color:#1C2833;font-weight:900}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:700}
.btn-danger{border:2px solid var(--line);background:transparent;color:#B3261E;font-weight:700}
html.soir .btn-danger{color:#FF9A93}
.btn-sq{width:44px;height:44px;padding:0;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;flex-shrink:0}
.inp{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;width:100%;min-width:0}
textarea.inp{padding:12px;resize:vertical}
select.inp{padding:0 12px;font-weight:600}
.lbl{font-size:14px;font-weight:800}

/* en-tete */
.hdr{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{height:46px;width:auto;flex-shrink:0}
.hdr-t{flex:1;min-width:0}
.ttl{font-size:17px;font-weight:800;line-height:1.15;letter-spacing:-0.01em}
.sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#8A949C}
.sdot.ok{background:#3E9B35}
.sdot.off{background:#B3261E}
.coordbtn{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.coordbtn.on{border-color:#EB7F3D;background:#EB7F3D;color:#1C2833;font-weight:800}
.coordbtn .short{display:none}
.menuwrap{position:relative}
.dots-btn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menu{position:absolute;right:0;top:52px;width:280px;max-width:calc(100vw - 32px);z-index:40;background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(28,40,51,0.18);padding:6px;display:flex;flex-direction:column;gap:2px}
.mi{min-height:48px;padding:0 12px;border:none;border-radius:10px;background:transparent;color:var(--ink);font-size:16px;font-weight:600;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.mi:hover{background:var(--warm)}
.mi small{font-size:13px;font-weight:700;color:var(--muted)}
.prog{height:6px;background:var(--track)}
.prog>div{height:100%;background:var(--doneBtn);transition:width .5s}

/* diffusion */
.bcbar{background:#1C2833;color:#fff;border-bottom:4px solid #EB7F3D}
.bcbar .in{padding:12px 16px;display:flex;align-items:center;gap:12px}
.bcbar .k{font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#F5A46E}
.bcbar .m{font-size:17px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.bcbar .x{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,0.35);background:transparent;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}

main{padding:16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--warm);border:2px solid #EB7F3D;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* celebration */
.celeb{background:#1C2833;color:#fff;border-radius:20px;padding:20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.celeb .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:#EB7F3D}
.logobox{flex-shrink:0;background:#FDEFE3;border-radius:16px;padding:10px 12px;display:flex}
.logobox img{height:60px;width:auto;display:block}
.celeb .k{font-size:13px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#F5A46E}
.celeb .t{font-size:26px;font-weight:900;line-height:1.1;margin-top:4px;text-wrap:balance}
.celeb .s{font-size:16px;font-weight:500;color:#DCE3E9;margin-top:6px}
.celeb .x{align-self:flex-start;width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,0.3);background:transparent;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}

/* prenom, filtres */
.myname{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px}
.myname label{font-size:15px;font-weight:700;white-space:nowrap}
.myname input{flex:1;min-width:0;min-height:44px;padding:0 10px;border:none;border-radius:10px;background:var(--lakeBg);color:var(--ink);font-size:17px;font-weight:700}
h1{margin:0;font-size:28px;font-weight:900;line-height:1.1;letter-spacing:-0.02em;text-wrap:balance}
.lead{margin:6px 0 0;font-size:16px;font-weight:500;color:var(--muted);text-wrap:pretty}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip b{font-size:13px;font-weight:800;color:var(--muted)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:800}
.chip.on b{color:inherit;opacity:0.85}

/* sections et cartes */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-top:6px}
.sec-h i{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.sec-h h2{margin:0;font-size:15px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase}
.sec-h span{font-size:15px;font-weight:600;color:var(--muted)}
.sec-h u{flex:1;min-width:24px;height:2px;background:var(--line);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .4s}
.card.done{background:var(--doneBg)}
.card.cur{border-color:#EB7F3D}
.card.mine{border-color:var(--lakeText)}
.card.fresh{box-shadow:0 0 0 4px rgba(235,127,61,0.45)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-top .sp{flex:1}
.tag{font-size:13px;font-weight:800;padding:5px 10px;border-radius:8px;background:var(--tagIdle);color:var(--ink)}
.tag.cur{background:#EB7F3D;color:#1C2833}
.tag.done{background:var(--doneBtn);color:var(--doneBtnInk)}
.tag.mine{background:var(--lakeBg);color:var(--lakeText)}
.tag.fresh{background:#1C2833;color:#F5A46E}
.typel{font-size:14px;font-weight:600;color:var(--muted)}
.cmenu{width:44px;height:44px;margin:-8px -8px -8px 0;border-radius:12px;border:none;background:transparent;color:var(--ink);font-size:22px;font-weight:800;cursor:pointer}
.cmenu:hover{background:var(--warm)}
h3{margin:0;font-size:20px;font-weight:800;line-height:1.2;text-wrap:pretty;overflow-wrap:anywhere}
.team{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dot.req{border-color:#EB7F3D}
.dot.on{background:var(--ink);border-color:var(--ink)}
.teamtxt{font-size:15px;font-weight:700;color:var(--muted)}
.teamtxt.warn{color:var(--accentText)}
.people{font-size:15px;font-weight:500;color:var(--muted);overflow-wrap:anywhere}
.details{font-size:15px;line-height:1.45;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:15px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--warm);overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px}
.form.lake{background:var(--lakeBg)}
.form.warm{background:var(--warm)}
.form .lbl{font-size:15px}
.form.warm .lbl{font-size:14px}
.form .inp.big{min-height:52px;font-size:18px;font-weight:700;border-color:var(--lakeText)}
.cta{min-height:56px;border-radius:14px;border:none;font-size:18px;font-weight:900;cursor:pointer;width:100%}
.cta:active{transform:scale(0.98)}
.cta.take{background:#EB7F3D;color:#1C2833}
.cta.join{border:3px solid #EB7F3D;background:var(--surface);color:var(--accentText)}
.cta.finish{background:var(--doneBtn);color:var(--doneBtnInk)}
.cardmenu{position:absolute;right:10px;top:54px;z-index:10;min-width:240px;max-width:calc(100% - 20px);background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(28,40,51,0.2);padding:6px;display:flex;flex-direction:column;gap:2px}
.cardmenu .mi{font-weight:700}
.addbtn{min-height:52px;width:100%;border-radius:14px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:16px;font-weight:700;cursor:pointer}
.addbtn:hover{border-color:#EB7F3D;color:var(--accentText)}
.secbtn{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.secbtn:hover{border-color:#EB7F3D;color:var(--accentText)}
.empty{text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:18px}
.empty b{display:block;font-size:20px;font-weight:800}
.empty span{display:block;font-size:16px;color:var(--muted);margin-top:6px}

/* projection */
.qrc{position:fixed;right:24px;bottom:24px;z-index:25;background:#fff;color:#1C2833;border-radius:20px;padding:14px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.45);border-bottom:6px solid #EB7F3D}
.qrc div{font-size:14px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px}
.qrc img{width:150px;height:150px;display:block}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;width:min(560px,calc(100% - 24px));background:#1C2833;color:#fff;border-radius:16px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.toast span{flex:1;font-size:16px;font-weight:700;overflow-wrap:anywhere;padding:6px 0}
.toast .btn{flex-shrink:0}

/* fenetres */
.bd{position:fixed;inset:0;z-index:70;background:rgba(28,40,51,0.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(380px,100%);background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.dlg h2{margin:0;font-size:22px;font-weight:900}
.dlg p,.dlg label.d{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.dlg .pin{min-height:56px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:26px;font-weight:800;letter-spacing:0.4em;text-align:center;width:100%}
.err{font-size:15px;font-weight:700;color:#B3261E}
html.soir .err{color:#FF9A93}
.dlg.qr{width:min(340px,100%);background:#fff;color:#1C2833;text-align:center;align-items:center;border-bottom:8px solid #EB7F3D}
.dlg.qr h2{font-size:20px}
.dlg.qr img{width:240px;height:240px;max-width:100%}
.dlg.qr .u{font-size:13px;font-weight:600;color:#4A5560;word-break:break-all}
.dlg.qr .btn-line{width:100%;border-color:#E8D5C2;color:#1C2833}
.side{position:fixed;inset:0;z-index:70;background:rgba(28,40,51,0.6);display:flex;justify-content:flex-end}
.side-in{width:min(380px,100%);height:100%;overflow-y:auto;background:var(--bg);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px}
.side-h{display:flex;align-items:center;gap:10px}
.side-h h2{flex:1;margin:0;font-size:22px;font-weight:900}
.lbrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.lbrow .r{width:32px;font-size:18px;font-weight:900;color:var(--accentText)}
.lbrow .n{flex:1;min-width:0}
.lbrow .n b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.lbrow .n span{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.lbrow .d{font-size:24px;font-weight:900;color:var(--doneText)}
.eod{position:fixed;inset:0;z-index:80;background:#1C2833;color:#fff;overflow-y:auto}
.eod .top{height:10px;background:#EB7F3D}
.eod .in{max-width:640px;margin:0 auto;padding:36px 20px 48px;display:flex;flex-direction:column;gap:28px}
.eod .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.eod .logobig{background:#FDEFE3;border-radius:24px;padding:18px 24px;display:flex;border-bottom:6px solid #EB7F3D}
.eod .logobig img{height:110px;width:auto;max-width:100%;display:block}
.eod .k{font-size:14px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#F5A46E}
.eod h2{margin:0;font-size:44px;font-weight:900;line-height:1;letter-spacing:-0.02em;text-wrap:balance}
.eod .head p{margin:0;font-size:18px;font-weight:500;color:#DCE3E9;text-wrap:pretty}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-radius:18px;padding:18px 12px;text-align:center;color:#1C2833}
.stat b{display:block;font-size:44px;font-weight:900;line-height:1}
.stat span{display:block;font-size:14px;font-weight:800;margin-top:6px}
.thanks{display:flex;flex-direction:column;gap:8px}
.thanks .k{font-size:14px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#F5A46E}
.thx{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:#243443}
.thx .r{width:28px;font-size:18px;font-weight:900;color:#F5A46E}
.thx .n{flex:1;min-width:0;font-size:18px;font-weight:800;overflow-wrap:anywhere}
.thx .s{font-size:15px;font-weight:600;color:#DCE3E9;text-align:right}
.eod .back{min-height:56px;border-radius:14px;border:2px solid rgba(255,255,255,0.4);background:transparent;color:#fff;font-size:17px;font-weight:800;cursor:pointer}

@media (max-width:480px){
  .logo{height:38px}
  .coordbtn{padding:0 10px;font-size:13px}
  .coordbtn .long{display:none}
  .coordbtn .short{display:inline}
  .celeb{flex-wrap:wrap}
  .celeb .t{font-size:22px}
  .eod h2{font-size:34px}
  .stat b{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="app"></div>
<div id="toast"></div>

<script src="vendor/qrcode.js"></script>
<script>
(function(){
'use strict';

// ── Utilitaires ──────────────────────────────────────────────────────────────
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function $(id){return document.getElementById(id);}
function lc(s){return String(s==null?'':s).trim().toLowerCase();}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var POLL_MS=15000;
var TYPES={peinture:'Peinture',jardinage:'Jardinage',montage:'Montage',nettoyage:'Nettoyage',manutention:'Manutention',reparation:'Réparation',rangement:'Rangement',hivernisation:'Hivernisation'};
var SEC_COLORS={a1:'#EB7F3D',a2:'#8BC6F1',b:'#5B7A8A'};
var LOGO_DARK='assets/logo-bruchesi-2025.png';
var LOGO_LIGHT='assets/logo-bruchesi-2025-blanc.png';

// ── Etat ─────────────────────────────────────────────────────────────────────
var DATA=[];            // [{p,s,tasks:[{id,nom,team,type,details}]}]
var state={};           // etat en direct renvoye par le serveur
var EVENT={titre:'Corvée',date:'',heure:''};
var VOLS=[];            // liste de benevoles
var tasksVersion=null, prevState=null, coordPin='', tasksLoaded=false;
var pendingRender=false, tasksStale=false, flushTimer=null, toastTimer=null, tickTimer=null;
var wakeLock=null, audioCtx=null, toastUndo=null;

var S={
  filter:'besoin', q:'', typeFilter:'', proj:false, sound:false, theme:'clair',
  coord:false, menuOpen:false, cardMenu:null,
  claimFor:null, claimMode:'take', noteFor:null, editFor:null, secEdit:null,
  pinOpen:false, pinErr:false, qrOpen:false, lbOpen:false, eodOpen:false, dlg:null,
  myName:'', bcDismissedTs:0, celebDismissed:false,
  recent:{}, online:null, drafts:{}
};

// ── Donnees derivees ─────────────────────────────────────────────────────────
function g(id){return state[id]||{s:'a-faire',n:'',extras:[]};}
function shortName(t){return String(t&&t.nom||'').split(' — ')[0];}
function parseTeam(t){var m=String(t||'').match(/\d+/g);if(!m)return{min:0,max:0};return{min:+m[0],max:+m[m.length-1]};}
var SEC_PALETTE=['#EB7F3D','#8BC6F1','#5B7A8A','#D9A441','#7FA36B'];
function secColor(p){
  if(SEC_COLORS[p])return SEC_COLORS[p];
  for(var i=0;i<DATA.length;i++)if(DATA[i].p===p)return SEC_PALETTE[i%SEC_PALETTE.length];
  return '#5B7A8A';
}
function secParts(sec){
  var s=String(sec.s||''),i=s.indexOf('—');
  if(i<0)return{label:s.trim(),sub:''};
  return{label:s.slice(0,i).trim(),sub:s.slice(i+1).trim()};
}
function allTasks(){var out=[];DATA.forEach(function(sec){(sec.tasks||[]).forEach(function(t){out.push(t);});});return out;}
function taskById(id){var a=allTasks();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function sectionOf(id){for(var i=0;i<DATA.length;i++){if((DATA[i].tasks||[]).some(function(t){return t.id===id;}))return DATA[i];}return null;}
function taskName(id){var t=taskById(id);return t?shortName(t):'';}

function computeInfo(){
  var me=lc(S.myName),out=[];
  DATA.forEach(function(sec){(sec.tasks||[]).forEach(function(t){
    var v=g(t.id),s=v.s||'a-faire',ex=v.extras||[];
    var people=s==='a-faire'?[]:[v.n].concat(ex).filter(Boolean);
    var pt=parseTeam(t.team),n=people.length;
    var mine=!!me&&people.some(function(p){return lc(p)===me;});
    var needs=s==='a-faire'||(s==='en-cours'&&n<pt.min);
    out.push({t:t,sec:sec,v:v,s:s,people:people,n:n,min:pt.min,max:pt.max,mine:mine,needs:needs});
  });});
  return out;
}

function buildBoard(){
  var ids={};allTasks().forEach(function(t){ids[t.id]=1;});
  var sc={};
  Object.keys(state).forEach(function(id){
    if(id.charAt(0)==='_'||!ids[id])return;
    var v=state[id];if(!v||v.s==='a-faire')return;
    [v.n].concat(v.extras||[]).forEach(function(raw){
      var nm=String(raw||'').trim();if(!nm)return;
      var k=nm.toLowerCase();
      if(!sc[k])sc[k]={name:nm,done:0,cur:0};
      if(v.s==='termine')sc[k].done++;else sc[k].cur++;
    });
  });
  return Object.keys(sc).map(function(k){return sc[k];})
    .sort(function(a,b){return b.done-a.done||b.cur-a.cur;})
    .map(function(r,i){
      var sub=[r.done?(r.done+' terminé'+(r.done>1?'s':'')):'',r.cur?(r.cur+' en cours'):''].filter(Boolean).join(' · ');
      return{rank:String(i+1),name:r.name,done:String(r.done),sub:sub};
    });
}

// ── Brouillons (saisies conservees d'un rendu a l'autre) ─────────────────────
function dv(id,def){return S.drafts[id]!==undefined?S.drafts[id]:def;}
function clearDrafts(prefixes){
  Object.keys(S.drafts).forEach(function(k){
    if(prefixes.some(function(p){return k.indexOf(p)===0;}))delete S.drafts[k];
  });
}
var FORM_PREFIXES=['claim-','note-','en-','et-','es-','ety-','ed-','sl-','ss-'];

// ── Rendu ────────────────────────────────────────────────────────────────────
function isDark(){return S.proj||S.theme==='soir';}

function hasOpenInteraction(){
  if(S.claimFor||S.noteFor||S.editFor||S.secEdit||S.pinOpen||S.dlg)return true;
  var ae=document.activeElement;
  if(!ae||ae===document.body||ae===document.documentElement)return false;
  var tag=ae.tagName.toLowerCase();
  return tag==='input'||tag==='textarea'||tag==='select';
}
function renderSoon(){if(hasOpenInteraction())pendingRender=true;else render();}
function afterInteraction(){
  if(hasOpenInteraction())return;
  if(tasksStale){tasksStale=false;pendingRender=false;loadTasks().then(render);}
  else if(pendingRender)render();
}
function queueFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(afterInteraction,ms||800);}

function focusSoon(id){
  setTimeout(function(){var el=$(id);if(el){el.focus();if(el.scrollIntoView)try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}},40);
}
function announce(msg){
  var el=$('live');if(!el)return;
  el.textContent='';
  setTimeout(function(){el.textContent=msg;},30);
}

function render(){
  pendingRender=false;
  var root=$('app');
  var ae=document.activeElement,fid=null,fs=null,fe=null;
  if(ae&&ae.id&&root.contains(ae)){fid=ae.id;try{fs=ae.selectionStart;fe=ae.selectionEnd;}catch(e){}}
  var scr={};
  root.querySelectorAll('[data-scroll]').forEach(function(el){scr[el.id]=el.scrollTop;});
  document.documentElement.className=S.proj?'proj':(S.theme==='soir'?'soir':'');
  root.innerHTML=view();
  Object.keys(scr).forEach(function(id){var el=$(id);if(el)el.scrollTop=scr[id];});
  if(fid){
    var el=$(fid);
    if(el){el.focus();try{if(fs!==null&&fs!==undefined)el.setSelectionRange(fs,fe);}catch(e){}}
  }
}

function pageUrl(){return location.origin+'/';}
var qrCache={};
function qrSrc(){
  var u=pageUrl();
  if(qrCache[u]===undefined){
    try{
      var q=window.qrcode(0,'M');q.addData(u);q.make();
      qrCache[u]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(q.createSvgTag({cellSize:4,margin:0,scalable:true}));
    }catch(e){qrCache[u]='';}
  }
  return qrCache[u];
}

// ── Reseau ───────────────────────────────────────────────────────────────────
function call(path,body,method){
  return fetch(path,{method:method||'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){
      return r.json().catch(function(){return{};}).then(function(d){
        S.online=true;
        return{ok:r.ok,status:r.status,d:d||{}};
      });
    })
    .catch(function(){
      S.online=false;
      showToast('Connexion perdue, réessaie');
      render();
      return null;
    });
}
function applyState(ns,ownId){
  if(!ns)return;
  detectChanges(ns,ownId);
  state=ns;
}
function errorFromRes(res){
  showToast((res.d&&res.d.error)||'Une erreur est survenue');
  if(res.d&&res.d.state)applyState(res.d.state);
  else fetchState();
  render();
}
function coordFailed(res){
  if(res.status===403){
    S.coord=false;coordPin='';
    showToast('Code incorrect : le mode coordonnateur est désactivé');
    render();
    return true;
  }
  return false;
}

function loadTasks(){
  return fetch('/api/tasks?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(d&&Array.isArray(d.tasks)){DATA=d.tasks;tasksLoaded=true;}
  }).catch(function(){});
}
function loadConfig(){
  return fetch('/api/config').then(function(r){return r.json();}).then(function(d){
    if(d&&d.event)EVENT=d.event;
    document.title=EVENT.titre+' — Camp Bruchési';
  }).catch(function(){});
}
function loadVolunteers(){
  return fetch('/api/volunteers').then(function(r){return r.json();}).then(function(d){
    VOLS=Array.isArray(d.names)?d.names:[];
  }).catch(function(){});
}

function fetchState(){
  return fetch('/api/state?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.state)throw new Error('etat');
    var wasOnline=S.online===true;
    S.online=true;
    var before=JSON.stringify(state);
    if(d.tasksVersion&&d.tasksVersion!==tasksVersion){
      var first=tasksVersion===null;
      tasksVersion=d.tasksVersion;
      if(!first)tasksStale=true;
    }
    detectChanges(d.state);
    state=d.state;
    var chain=Promise.resolve(false);
    if(!tasksLoaded||(tasksStale&&!hasOpenInteraction())){
      tasksStale=false;
      chain=loadTasks().then(function(){return true;});
    }
    return chain.then(function(reloaded){
      if(reloaded||!wasOnline||before!==JSON.stringify(state))renderSoon();
    });
  }).catch(function(){
    var was=S.online;
    S.online=false;
    if(was!==false)renderSoon();
  });
}

// ── Changements faits par d'autres ───────────────────────────────────────────
function detectChanges(ns,ownId){
  if(!prevState){prevState=JSON.parse(JSON.stringify(ns));return;}
  var ids={};
  Object.keys(prevState).forEach(function(k){ids[k]=1;});
  Object.keys(ns).forEach(function(k){ids[k]=1;});
  var played=false;
  Object.keys(ids).forEach(function(id){
    if(id.charAt(0)==='_'||id===ownId)return;
    var prev=(prevState[id]||{}).s||'a-faire',curr=(ns[id]||{}).s||'a-faire';
    if(prev===curr)return;
    if(curr!=='en-cours'&&curr!=='termine')return;
    S.recent[id]=Date.now()+6000;
    var t=taskById(id);
    if(t){
      var who=(ns[id]||{}).n;
      announce(curr==='termine'?'« '+shortName(t)+' » est terminé':(who?who+' a pris « '+shortName(t)+' »':'« '+shortName(t)+' » est pris'));
    }
    if(!played){playSound(curr==='termine'?'done':'claim');played=true;}
  });
  prevState=JSON.parse(JSON.stringify(ns));
}

function startPolling(){
  fetchState();
  setInterval(fetchState,POLL_MS);
  tickTimer=setInterval(function(){
    var now=Date.now(),r=S.recent,expired=false;
    Object.keys(r).forEach(function(k){if(r[k]<=now){delete r[k];expired=true;}});
    if(expired)renderSoon();
  },1000);
}

// ── Sons ─────────────────────────────────────────────────────────────────────
function getCtx(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(function(){});
  return audioCtx;
}
function playSound(type){
  if(!S.sound)return;
  try{
    var ctx=getCtx();if(!ctx)return;
    var gn=ctx.createGain();
    gn.connect(ctx.destination);
    gn.gain.setValueAtTime(0.2,ctx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    var o=ctx.createOscillator();
    o.connect(gn);
    o.type='triangle';
    o.frequency.setValueAtTime(type==='done'?784:660,ctx.currentTime);
    o.frequency.setValueAtTime(type==='done'?1047:880,ctx.currentTime+0.15);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime+0.5);
  }catch(e){}
}

// ── Ecran allume et plein ecran (projection) ─────────────────────────────────
function requestWakeLock(){
  if('wakeLock' in navigator){
    try{
      navigator.wakeLock.request('screen').then(function(l){
        wakeLock=l;
        l.addEventListener('release',function(){wakeLock=null;});
      }).catch(function(){});
    }catch(e){}
  }
}
function releaseWakeLock(){
  if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null;}
}
document.addEventListener('visibilitychange',function(){
  if(S.proj&&document.visibilityState==='visible')requestWakeLock();
});
function toggleProj(){
  S.proj=!S.proj;S.menuOpen=false;S.cardMenu=null;
  try{
    if(S.proj){
      if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});
      requestWakeLock();
    }else{
      releaseWakeLock();
      if(document.fullscreenElement)document.exitFullscreen().catch(function(){});
    }
  }catch(e){}
  render();
}

// ── Toast ────────────────────────────────────────────────────────────────────
function hideToast(){clearTimeout(toastTimer);$('toast').innerHTML='';}
function showToast(msg,undo){
  clearTimeout(toastTimer);
  toastUndo=undo||null;
  $('toast').innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(undo?'<button class="btn btn-orange" data-action="undo-toast">Annuler</button>':'')+'</div>';
  announce(msg);
  toastTimer=setTimeout(hideToast,6000);
}
function undo(path,body){
  hideToast();
  return call(path,body).then(function(r){
    if(!r)return;
    if(!r.ok)return errorFromRes(r);
    applyState(r.d.state,body.id);
    render();
    announce('Action annulée');
  });
}

// ── Actions sur les chantiers ────────────────────────────────────────────────
function closeForms(){
  S.claimFor=null;S.noteFor=null;S.secEdit=null;
  if(S.editFor){S.editFor=null;removeEmptyTasks();}
  clearDrafts(FORM_PREFIXES);
}
function removeEmptyTasks(){
  DATA.forEach(function(sec){sec.tasks=(sec.tasks||[]).filter(function(t){return t.nom&&String(t.nom).trim();});});
}

function primary(id,kind){
  if(kind==='finish')return doFinish(id);
  var me=S.myName.trim();
  if(me)return doClaim(id,me,kind);
  closeForms();
  S.claimFor=id;S.claimMode=kind;S.cardMenu=null;
  render();focusSoon('claim-'+id);
}

function doClaim(id,name,mode){
  name=String(name||'').trim();
  if(!name)return;
  var t=taskById(id),cur=g(id);
  if(mode==='join'){
    var all=[cur.n].concat(cur.extras||[]).map(lc);
    if(all.indexOf(lc(name))>=0){
      closeForms();render();showToast('Tu es déjà dans cette équipe');
      return;
    }
  }
  return call(mode==='join'?'/api/join':'/api/claim',{id:id,name:name}).then(function(r){
    if(!r)return;
    if(!r.ok){closeForms();return errorFromRes(r);}
    applyState(r.d.state,id);
    if(!S.myName){S.myName=name;lsSet('cv26_myname',name);}
    closeForms();S.cardMenu=null;
    render();
    if(mode==='join')showToast(name+' se joint à « '+shortName(t)+' »',function(){undo('/api/leave',{id:id,name:name});});
    else showToast(name+' a pris « '+shortName(t)+' »',function(){undo('/api/release',{id:id});});
  });
}

function doFinish(id){
  var t=taskById(id);
  return call('/api/complete',{id:id}).then(function(r){
    if(!r)return;
    if(!r.ok)return errorFromRes(r);
    applyState(r.d.state,id);S.cardMenu=null;
    render();
    showToast('« '+shortName(t)+' » est terminé. Merci !',function(){undo('/api/reopen',{id:id});});
  });
}

function doRelease(id){
  var t=taskById(id);
  return call('/api/release',{id:id}).then(function(r){
    if(!r)return;
    if(!r.ok)return errorFromRes(r);
    applyState(r.d.state,id);S.cardMenu=null;
    render();
    showToast('« '+shortName(t)+' » est de nouveau disponible');
  });
}

function doLeave(id){
  var t=taskById(id),cur=g(id),me=lc(S.myName);
  var actual=[cur.n].concat(cur.extras||[]).filter(function(x){return lc(x)===me;})[0]||S.myName.trim();
  return call('/api/leave',{id:id,name:actual}).then(function(r){
    if(!r)return;
    if(!r.ok)return errorFromRes(r);
    applyState(r.d.state,id);S.cardMenu=null;
    render();
    showToast('Tu as quitté « '+shortName(t)+' »');
  });
}

function doCycle(id){
  var cur=g(id),s=cur.s||'a-faire';
  var nx=s==='a-faire'?'en-cours':s==='en-cours'?'termine':'a-faire';
  var label={'a-faire':'Disponible','en-cours':'En cours','termine':'Terminé'}[nx];
  var last=null;
  function send(field,value){
    return call('/api/state',{pin:coordPin,id:id,field:field,value:value});
  }
  return send('s',nx).then(function(r){
    if(!r)return null;
    if(!r.ok){if(!coordFailed(r))errorFromRes(r);return null;}
    last=r;
    if(nx==='a-faire'&&cur.n)return send('n','');
    if(nx!=='a-faire'&&!cur.n)return send('n','Équipe');
    return r;
  }).then(function(r2){
    if(!r2)return;
    if(!r2.ok){if(!coordFailed(r2))errorFromRes(r2);return;}
    last=r2;
    applyState(last.d.state,id);S.cardMenu=null;
    render();
    showToast('Statut : '+label);
  });
}

function doSaveNote(id){
  var el=$('note-'+id);
  var note=(el?el.value:dv('note-'+id,'')).trim();
  return call('/api/note',{id:id,note:note}).then(function(r){
    if(!r)return;
    if(!r.ok)return errorFromRes(r);
    applyState(r.d.state,id);
    closeForms();render();
    showToast('Note enregistrée');
  });
}

// ── Chantiers (coordonnateur) ────────────────────────────────────────────────
function taskCall(method,path,body){
  body=body||{};body.pin=coordPin;
  return call(path,body,method).then(function(r){
    if(!r)return null;
    if(!r.ok){if(!coordFailed(r)){tasksStale=true;errorFromRes(r);}return null;}
    if(Array.isArray(r.d.tasks))DATA=r.d.tasks;
    if(r.d.tasksVersion)tasksVersion=r.d.tasksVersion;
    return r;
  });
}

function addTask(p){
  removeEmptyTasks();
  closeForms();
  var sec=DATA.filter(function(s){return s.p===p;})[0];
  if(!sec)return;
  var id='new-'+Date.now().toString(36);
  sec.tasks=sec.tasks||[];
  sec.tasks.push({id:id,nom:'',team:'',type:'',_new:true});
  S.editFor=id;S.cardMenu=null;
  render();focusSoon('en-'+id);
}

function saveEdit(id){
  var nomEl=$('en-'+id);
  var nom=(nomEl?nomEl.value:'').trim();
  if(!nom){showToast('Donne un nom au chantier');if(nomEl)nomEl.focus();return;}
  var t=taskById(id);if(!t)return;
  var val=function(pfx,def){var el=$(pfx+id);return el?el.value:def;};
  var oldSec=sectionOf(id);
  var p=val('es-',oldSec?oldSec.p:'');
  var body={nom:nom,team:String(val('et-',t.team||'')).trim(),type:val('ety-',t.type||''),details:String(val('ed-',t.details||'')).trim()};
  var isNew=!!t._new;
  var req;
  if(isNew)req=taskCall('POST','/api/sections/'+encodeURIComponent(p)+'/tasks',body);
  else{body.p=p;req=taskCall('PUT','/api/tasks/'+encodeURIComponent(id),body);}
  return req.then(function(r){
    if(!r)return;
    S.editFor=null;clearDrafts(FORM_PREFIXES);removeEmptyTasks();
    render();showToast(isNew?'Chantier ajouté':'Chantier enregistré');
    afterInteraction();
  });
}

function saveSection(key){
  var l=$('sl-'+key),s=$('ss-'+key);
  var label=(l?l.value:'').trim(),sub=(s?s.value:'').trim();
  if(!label){showToast('Donne un nom à la section');if(l)l.focus();return;}
  var isNew=key==='_new';
  return taskCall(isNew?'POST':'PUT',isNew?'/api/sections':'/api/sections/'+encodeURIComponent(key),{s:sub?label+' — '+sub:label}).then(function(r){
    if(!r)return;
    S.secEdit=null;clearDrafts(['sl-','ss-']);
    render();showToast(isNew?'Section ajoutée':'Section renommée');afterInteraction();
  });
}

function askDelete(id){
  var t=taskById(id);
  S.dlg={
    title:'Supprimer ce chantier ?',
    text:'« '+(t&&t.nom?t.nom:'Nouveau chantier')+' » sera retiré de la liste pour tout le monde.',
    okLabel:'Supprimer',danger:true,
    onOk:function(){
      var t=taskById(id);
      if(t&&t._new){closeForms();render();return;}
      return taskCall('DELETE','/api/tasks/'+encodeURIComponent(id)).then(function(r){
        if(!r)return;
        S.editFor=null;clearDrafts(FORM_PREFIXES);
        render();showToast('Chantier supprimé');afterInteraction();
      });
    }
  };
  render();focusSoon('dlg-ok');
}

// ── Diffusion et benevoles ───────────────────────────────────────────────────
function sendBroadcast(msg){
  return call('/api/broadcast',{pin:coordPin,msg:msg}).then(function(r){
    if(!r)return;
    if(!r.ok){if(!coordFailed(r))errorFromRes(r);return;}
    clearDrafts(['bc-input']);
    return fetchState().then(function(){render();showToast(msg?'Message diffusé':'Message effacé');});
  });
}
function saveVolunteers(){
  var el=$('vol-input');
  var names=(el?el.value:VOLS.join('\n')).split(/\r?\n/).map(function(n){return n.trim();}).filter(Boolean);
  return call('/api/volunteers',{pin:coordPin,names:names}).then(function(r){
    if(!r)return;
    if(!r.ok){if(!coordFailed(r))errorFromRes(r);return;}
    VOLS=Array.isArray(r.d.names)?r.d.names:names;
    clearDrafts(['vol-input']);
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    render();
    showToast('Liste des bénévoles enregistrée');
  });
}

// ── Nouvelle corvee : archive JSON puis remise a zero ───────────────────────
function slug(s){return String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'corvee';}
function downloadArchive(){
  var data={archive:'corvee-bruchesi',exportedAt:new Date().toISOString(),event:EVENT,tasks:DATA,state:state,volunteers:VOLS};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=slug(EVENT.titre)+'-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
function newCorvee(){
  S.menuOpen=false;render();
  Promise.all([fetchState(),loadTasks(),loadVolunteers()]).then(function(){
    if(S.online!==true){showToast('Hors ligne : impossible d’archiver la corvée');render();return;}
    downloadArchive();
    S.dlg={
      title:'Remettre le tableau à zéro ?',
      text:'L’archive JSON vient d’être téléchargée. Tous les chantiers repasseront « à faire », sans équipes ni notes, et le message diffusé sera effacé. La liste des chantiers et des bénévoles est conservée.',
      okLabel:'Remettre à zéro',danger:true,
      onOk:doReset
    };
    render();focusSoon('dlg-ok');
  });
}
function doReset(){
  return call('/api/reset',{pin:coordPin}).then(function(r){
    if(!r)return;
    if(!r.ok){if(!coordFailed(r))errorFromRes(r);return;}
    S.celebDismissed=false;S.bcDismissedTs=0;
    return fetchState().then(function(){render();showToast('Nouvelle corvée prête');});
  });
}

// ── Connexion coordonnateur ──────────────────────────────────────────────────
function submitPin(){
  var el=$('pin');
  var pin=el?el.value:dv('pin','');
  if(!pin)return;
  return call('/api/login',{pin:pin}).then(function(r){
    if(!r)return;
    if(r.ok){
      coordPin=pin;S.coord=true;S.pinOpen=false;S.pinErr=false;clearDrafts(['pin']);
      render();announce('Mode coordonnateur activé');
      loadVolunteers().then(function(){renderSoon();});
    }else if(r.status===403){
      S.pinErr=true;clearDrafts(['pin']);render();focusSoon('pin');
    }else{
      showToast('Erreur de connexion');render();
    }
  });
}

// ── Version imprimable ───────────────────────────────────────────────────────
function gS(id){return(state[id]||{}).s||'a-faire';}
function gN(id){return(state[id]||{}).n||'';}
function gNote(id){return(state[id]||{}).note||'';}
function openPrint(){
  var logoSrc=location.origin+'/'+LOGO_DARK;
  var total=0,done=0,prog=0,todo=0;
  DATA.forEach(function(s){(s.tasks||[]).forEach(function(t){total++;var v=gS(t.id);if(v==='termine')done++;else if(v==='en-cours')prog++;else todo++;});});
  var typeLabels=TYPES;
  var secColors={a1:'#C05A15',a2:'#1E6895',b:'#3D5A6A'};
  var now=new Date();
  var dateStr=now.toLocaleDateString('fr-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var timeStr=now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});

  var tasksHtml='';
  DATA.forEach(function(sec){
    tasksHtml+='<div class="sec-block"><div class="sec-hdr" style="background:'+(secColors[sec.p]||'#3D5A6A')+'">'+esc(sec.s)+'</div><div class="tasks-grid">';
    (sec.tasks||[]).forEach(function(t){
      var v=gS(t.id),nm=gN(t.id),note=gNote(t.id);
      var ex=(g(t.id).extras||[]);
      var who=v==='a-faire'?'':[nm].concat(ex).filter(Boolean).join(', ');
      var stTxt=v==='a-faire'?'Disponible':(v==='en-cours'?'En cours':'Terminé');
      var stColor=v==='a-faire'?'#888':(v==='en-cours'?'#B84A00':'#2D6B22');
      var stBg=v==='a-faire'?'#F2F2F2':(v==='en-cours'?'#FFF3EB':'#EDF7E6');
      tasksHtml+='<div class="task-card st-'+esc(v)+'">';
      tasksHtml+='<div class="task-top"><div class="task-nom">'+esc(t.nom)+'</div><div class="task-team">'+esc(t.team)+'</div></div>';
      tasksHtml+='<div class="task-tags">';
      if(t.type&&typeLabels[t.type])tasksHtml+='<span class="tag-type">'+esc(typeLabels[t.type])+'</span>';
      tasksHtml+='<span class="tag-st" style="color:'+stColor+';background:'+stBg+'">'+stTxt+'</span>';
      if(who)tasksHtml+='<span class="tag-name">'+esc(who)+'</span>';
      tasksHtml+='</div>';
      if(t.details)tasksHtml+='<div class="task-details">'+esc(t.details).replace(/\n/g,'<br>')+'</div>';
      if(note)tasksHtml+='<div class="task-note">'+esc(note)+'</div>';
      tasksHtml+='</div>';
    });
    tasksHtml+='</div></div>';
  });

  var css='*{box-sizing:border-box;margin:0;padding:0;}'+
    'body{font-family:"Segoe UI",Arial,sans-serif;color:#1C2833;background:#fff;font-size:10.5pt;line-height:1.4;}'+
    '.print-hdr{display:flex;align-items:center;gap:18px;padding:18px 28px 14px;border-bottom:3px solid #EB7F3D;margin-bottom:18px;}'+
    '.print-logo{height:58px;width:auto;}'+
    '.hdr-title{font-size:20pt;font-weight:800;color:#EB7F3D;letter-spacing:-0.5px;line-height:1.1;}'+
    '.hdr-sub{font-size:10pt;color:#777;margin-top:3px;}'+
    '.hdr-stats{margin-left:auto;display:flex;gap:10px;}'+
    '.stat-pill{text-align:center;padding:8px 14px;border-radius:10px;min-width:70px;}'+
    '.stat-n{font-size:20pt;font-weight:800;line-height:1;}'+
    '.stat-l{font-size:7.5pt;text-transform:uppercase;letter-spacing:1px;margin-top:3px;opacity:0.65;}'+
    '.stat-done{background:#EDF7E6;}.stat-done .stat-n{color:#2D6B22;}'+
    '.stat-prog{background:#FFF3EB;}.stat-prog .stat-n{color:#B84A00;}'+
    '.stat-todo{background:#F2F2F2;}.stat-todo .stat-n{color:#555;}'+
    '.sec-block{margin-bottom:22px;}'+
    '.sec-hdr{color:#fff;font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:2px;padding:7px 14px;border-radius:6px;margin-bottom:10px;}'+
    '.tasks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}'+
    '.task-card{border:1px solid #E5E5E5;border-radius:9px;padding:11px 13px;break-inside:avoid;border-left:4px solid #CCC;}'+
    '.task-card.st-termine{border-left-color:#3D7A30;background:#F8FEF4;}'+
    '.task-card.st-en-cours{border-left-color:#EB7F3D;background:#FFFAF5;}'+
    '.task-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;}'+
    '.task-nom{font-size:11pt;font-weight:700;flex:1;line-height:1.3;}'+
    '.task-team{font-size:8.5pt;color:#888;background:#F2F2F2;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;margin-top:1px;}'+
    '.task-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:7px;}'+
    '.tag-type{font-size:8.5pt;background:#F0F0F0;padding:2px 8px;border-radius:10px;color:#555;}'+
    '.tag-st{font-size:8.5pt;font-weight:700;padding:2px 9px;border-radius:10px;}'+
    '.tag-name{font-size:8.5pt;color:#666;}'+
    '.task-details{font-size:9pt;color:#555;margin-bottom:8px;padding:6px 9px;background:#F9F9F9;border-radius:6px;border-left:2px solid #DDD;line-height:1.5;}'+
    '.task-note{font-size:8.5pt;color:#888;margin-top:7px;padding:4px 8px;background:#FFFBF0;border-radius:5px;border-left:2px solid #F0E0A0;font-style:italic;}'+
    '.print-footer{margin-top:26px;padding-top:12px;border-top:1px solid #EEE;font-size:8pt;color:#AAA;text-align:center;}'+
    '.no-print-btn{margin:0 auto 18px;display:block;padding:9px 24px;background:#EB7F3D;color:#fff;border:none;border-radius:8px;font-size:11pt;font-weight:700;cursor:pointer;}'+
    '@media print{.no-print-btn{display:none;}@page{margin:1.4cm;}body{font-size:9.5pt;}}';

  var body='<button class="no-print-btn" onclick="window.print()">Imprimer</button>'+
    '<div class="print-hdr">'+
      '<img class="print-logo" src="'+esc(logoSrc)+'" alt="Camp Bruchési">'+
      '<div class="hdr-text">'+
        '<div class="hdr-title">'+esc(EVENT.titre)+'</div>'+
        '<div class="hdr-sub">Camp Bruchési &nbsp;·&nbsp; '+esc(EVENT.date)+' &nbsp;·&nbsp; '+esc(EVENT.heure)+' &nbsp;&nbsp; — &nbsp;&nbsp; Imprimé le '+esc(dateStr)+' à '+esc(timeStr)+'</div>'+
      '</div>'+
      '<div class="hdr-stats">'+
        '<div class="stat-pill stat-done"><div class="stat-n">'+done+'</div><div class="stat-l">Terminés</div></div>'+
        '<div class="stat-pill stat-prog"><div class="stat-n">'+prog+'</div><div class="stat-l">En cours</div></div>'+
        '<div class="stat-pill stat-todo"><div class="stat-n">'+todo+'</div><div class="stat-l">Disponibles</div></div>'+
      '</div>'+
    '</div>'+
    tasksHtml+
    '<div class="print-footer">'+esc(EVENT.titre)+' — Camp Bruchési &mdash; '+total+' chantiers au total</div>';

  var w=window.open('','_blank','width=900,height=700');
  if(w){
    w.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>'+esc(EVENT.titre)+' — Impression</title><style>'+css+'</style></head><body>'+body+'</body></html>');
    w.document.close();
  }else{
    showToast('Autorise les fenêtres pop-up pour imprimer');
  }
}

// ── Evenements (delegation) ──────────────────────────────────────────────────
function handle(action,el){
  var id=el.getAttribute('data-id');
  switch(action){
    case 'toggle-coord':
      if(S.coord){
        S.coord=false;coordPin='';closeForms();
        render();announce('Mode coordonnateur désactivé');
      }else{
        S.pinOpen=true;S.pinErr=false;clearDrafts(['pin']);S.menuOpen=false;S.cardMenu=null;
        render();focusSoon('pin');
      }
      break;
    case 'pin-submit':submitPin();break;
    case 'close-pin':S.pinOpen=false;S.pinErr=false;clearDrafts(['pin']);render();afterInteraction();break;
    case 'toggle-menu':S.menuOpen=!S.menuOpen;S.cardMenu=null;render();break;
    case 'menu-qr':S.qrOpen=true;S.menuOpen=false;render();break;
    case 'menu-theme':S.theme=isDark()&&S.theme==='soir'?'clair':'soir';lsSet('cv26_theme2',S.theme);S.menuOpen=false;render();break;
    case 'menu-proj':toggleProj();break;
    case 'menu-sound':
      S.sound=!S.sound;lsSet('cv26_sound',S.sound?'1':'0');
      if(S.sound)getCtx();
      render();
      break;
    case 'menu-lb':S.lbOpen=true;S.menuOpen=false;render();break;
    case 'menu-print':S.menuOpen=false;render();openPrint();break;
    case 'sec-edit':closeForms();S.secEdit=el.getAttribute('data-p');S.cardMenu=null;render();focusSoon('sl-'+S.secEdit);break;
    case 'sec-add':closeForms();S.secEdit='_new';S.cardMenu=null;render();focusSoon('sl-_new');break;
    case 'sec-save':saveSection(el.getAttribute('data-p'));break;
    case 'sec-cancel':closeForms();render();afterInteraction();break;
    case 'menu-new':newCorvee();break;
    case 'menu-eod':S.eodOpen=true;S.menuOpen=false;render();break;
    case 'close-qr':S.qrOpen=false;render();break;
    case 'close-lb':S.lbOpen=false;render();break;
    case 'close-eod':S.eodOpen=false;render();break;
    case 'dismiss-bc':S.bcDismissedTs=(state._broadcast||{}).ts||0;render();break;
    case 'dismiss-celeb':S.celebDismissed=true;render();break;
    case 'bc-send':{
      var bi=$('bc-input'),m=(bi?bi.value:'').trim();
      if(m)sendBroadcast(m);
      break;
    }
    case 'bc-clear':sendBroadcast('');break;
    case 'vol-save':saveVolunteers();break;
    case 'filter':S.filter=el.getAttribute('data-f');S.cardMenu=null;render();break;
    case 'card-menu':S.cardMenu=S.cardMenu===id?null:id;S.menuOpen=false;render();break;
    case 'primary':primary(id,el.getAttribute('data-kind'));break;
    case 'claim-submit':{
      var ci=$('claim-'+id);
      doClaim(id,ci?ci.value:dv('claim-'+id,''),S.claimMode);
      break;
    }
    case 'claim-cancel':case 'note-cancel':closeForms();render();afterInteraction();break;
    case 'note-save':doSaveNote(id);break;
    case 'mi-finish':primary(id,'finish');break;
    case 'mi-leave':doLeave(id);break;
    case 'mi-release':doRelease(id);break;
    case 'mi-note':
      closeForms();S.noteFor=id;S.cardMenu=null;
      render();focusSoon('note-'+id);
      break;
    case 'mi-cycle':doCycle(id);break;
    case 'mi-edit':
      closeForms();S.editFor=id;S.cardMenu=null;
      render();focusSoon('en-'+id);
      break;
    case 'edit-save':saveEdit(id);break;
    case 'edit-cancel':closeForms();render();afterInteraction();break;
    case 'edit-delete':askDelete(id);break;
    case 'add-task':addTask(el.getAttribute('data-p'));break;
    case 'dlg-ok':{
      var d=S.dlg;S.dlg=null;
      if(d&&d.onOk)d.onOk();else render();
      break;
    }
    case 'dlg-cancel':S.dlg=null;render();afterInteraction();break;
    case 'undo-toast':{
      var u=toastUndo;toastUndo=null;hideToast();
      if(u)u();
      break;
    }
  }
}

document.addEventListener('click',function(e){
  var tg=e.target;
  if(tg.hasAttribute&&tg.hasAttribute('data-bd')){handle(tg.getAttribute('data-bd'),tg);return;}
  var a=tg.closest?tg.closest('[data-action]'):null;
  if(!(tg.closest&&tg.closest('[data-menu]'))&&(S.menuOpen||S.cardMenu)){
    S.menuOpen=false;S.cardMenu=null;
    if(!a)render();
  }
  if(a)handle(a.getAttribute('data-action'),a);
});

function onField(e){
  var t=e.target;
  if(!t||!t.id)return;
  if(t.id==='search'){
    if(e.type==='input'){S.q=t.value;render();}
    return;
  }
  if(t.id==='typef'){S.typeFilter=t.value;render();return;}
  if(t.id==='myname'){
    if(e.type==='input'){S.drafts.myname=t.value;return;}
    S.myName=t.value.trim();lsSet('cv26_myname',S.myName);
    delete S.drafts.myname;
    if(!S.myName&&S.filter==='mine')S.filter='besoin';
    pendingRender=true;queueFlush(800);
    return;
  }
  S.drafts[t.id]=t.value;
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

document.addEventListener('focusout',function(){queueFlush(800);});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var t=e.target,act=t&&t.getAttribute?t.getAttribute('data-enter'):null;
    if(act){e.preventDefault();handle(act,t);}
  }else if(e.key==='Escape'){
    if(S.menuOpen||S.cardMenu||S.qrOpen||S.lbOpen||S.pinOpen||S.dlg){
      S.menuOpen=false;S.cardMenu=null;S.qrOpen=false;S.lbOpen=false;S.pinOpen=false;S.dlg=null;
      render();afterInteraction();
    }
  }
});

window.addEventListener('online',function(){fetchState();});
window.addEventListener('offline',function(){S.online=false;renderSoon();});

// ── Demarrage ────────────────────────────────────────────────────────────────
S.myName=lsGet('cv26_myname')||'';
S.sound=lsGet('cv26_sound')==='1';
S.theme=lsGet('cv26_theme2')==='soir'?'soir':'clair';
render();
Promise.all([loadConfig(),loadVolunteers(),loadTasks()]).then(function(){
  render();
  startPolling();
});
})();
</script>
